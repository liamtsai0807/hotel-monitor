{
 "name": "找房源",
 "on": {
  "workflow_dispatch": {
   "inputs": {
    "query": {
     "description": "飯店名稱（建議加上城市，例如：東京 京王廣場飯店）",
     "required": true
    },
    "check_in": {
     "description": "入住日期 YYYY-MM-DD（空白 = 用 config.toml 的設定）",
     "required": false
    },
    "check_out": {
     "description": "退房日期 YYYY-MM-DD",
     "required": false
    }
   }
  }
 },
 "jobs": {
  "find": {
   "runs-on": "ubuntu-latest",
   "env": {
    "SERPAPI_KEY": "${{ secrets.SERPAPI_KEY }}",
    "QUERY": "${{ inputs.query }}",
    "CHECK_IN": "${{ inputs.check_in }}",
    "CHECK_OUT": "${{ inputs.check_out }}"
   },
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-python@v5",
     "with": {
      "python-version": "3.12"
     }
    },
    {
     "name": "搜尋",
     "run": "args=()\n[ -n \"$CHECK_IN\" ] && args+=(--check-in \"$CHECK_IN\")\n[ -n \"$CHECK_OUT\" ] && args+=(--check-out \"$CHECK_OUT\")\npython hotel_monitor.py find \"$QUERY\" \"${args[@]}\" | tee result.txt\n{ echo '## 搜尋結果'; echo '```'; cat result.txt; echo '```'; } >> \"$GITHUB_STEP_SUMMARY\"\n"
    }
   ]
  }
 }
}
