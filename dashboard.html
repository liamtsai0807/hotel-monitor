<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訂房價格監控</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --good-text: #006300;
  --critical: #d03b3b;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --good-text: #0ca30c;
    --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --good-text: #0ca30c;
  --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 22px; font-weight: 600; }
.status { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
button {
  font: inherit; cursor: pointer; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
  padding: 6px 14px;
}
button:hover { background: color-mix(in srgb, var(--text-primary) 5%, var(--surface)); }
button:disabled { opacity: .55; cursor: default; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 500; }
button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }

a.btnlink {
  border-radius: 8px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-primary); padding: 6px 14px; text-decoration: none;
}
a.btnlink:hover { background: color-mix(in srgb, var(--text-primary) 5%, var(--surface)); }
[hidden] { display: none !important; }

.filters { display: flex; gap: 12px; align-items: center; margin: 20px 0 16px; flex-wrap: wrap; }
.filters .label { color: var(--text-secondary); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; background: transparent; color: var(--text-secondary); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--text-primary); font-weight: 600; }

.banner {
  border: 1px solid color-mix(in srgb, var(--critical) 40%, transparent);
  background: color-mix(in srgb, var(--critical) 8%, var(--surface));
  border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px;
}
.banner[hidden] { display: none; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 20px; margin-bottom: 16px;
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.trip { color: var(--text-secondary); font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 8px; }
.stat .k { color: var(--text-secondary); font-size: 12px; }
.stat .v { font-size: 20px; font-weight: 600; white-space: nowrap; }
.stat .sub { color: var(--text-muted); font-size: 12px; }
.stat .v.good { color: var(--good-text); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.chart { position: relative; margin-top: 8px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus { outline: none; }
.chart svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.dlabel { fill: var(--text-secondary); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dlabel, .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.empty { color: var(--text-muted); padding: 32px 0; text-align: center; }

.tooltip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  padding: 8px 10px; font-size: 12px; min-width: 150px;
}
.tooltip[hidden] { display: none; }
.tooltip .t { color: var(--text-muted); margin-bottom: 4px; }
.tooltip .row { display: flex; align-items: center; gap: 8px; }
.tooltip .key { width: 12px; height: 2px; border-radius: 1px; flex: none; }
.tooltip .val { font-weight: 600; font-variant-numeric: tabular-nums; }
.tooltip .name { color: var(--text-secondary); }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }

details { margin-top: 12px; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
.tablewrap { overflow-x: auto; margin-top: 8px; max-height: 280px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 500; position: sticky; top: 0; background: var(--surface); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>訂房價格監控</h1>
      <div class="status" id="status">載入中…</div>
    </div>
    <button class="primary" id="checkBtn">立即檢查</button>
    <a class="btnlink" id="runLink" target="_blank" rel="noopener" hidden>手動執行 ↗</a>
  </header>

  <div class="filters">
    <span class="label">時間範圍</span>
    <div class="seg" id="range">
      <button data-h="0" aria-pressed="true">全部</button>
      <button data-h="720">30 天</button>
      <button data-h="168">7 天</button>
      <button data-h="24">24 小時</button>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <main id="cards"></main>
</div>

<script>
const SVGNS = "http://www.w3.org/2000/svg";
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5"];
const MAX_SOURCES = 5;

let DATA = null;
let rangeHours = 0;
const modes = {};          // 每張卡片目前顯示「最低價」或「各網站」
let pollTimer = null;

// ---------- helpers
const $ = (sel, el = document) => el.querySelector(sel);
function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
function svg(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = v => v == null ? "—" : Math.round(v).toLocaleString("en-US");
const money = v => v == null ? "—" : `${DATA.currency} ${fmt(v)}`;
const compact = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("en-US", { maximumFractionDigits: 1 }) + "K" : String(Math.round(v));
const pad = n => String(n).padStart(2, "0");
const fmtTime = d => `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

function niceTicks(lo, hi, count = 4) {
  const span = hi - lo || Math.abs(hi) || 1;
  const raw = span / count;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const start = Math.floor(lo / step) * step;
  const ticks = [];
  for (let v = start; v <= hi + step * 0.5; v += step) ticks.push(v);
  return ticks;
}

function inRange(points) {
  if (!rangeHours) return points;
  const cut = Date.now() - rangeHours * 3600e3;
  return points.filter(p => p.d.getTime() >= cut);
}

// ---------- chart
// series: [{name, color, points:[{d, v}]}]
function renderChart(box, series, { target, endLabel, markMin }) {
  box.replaceChildren();
  const all = series.flatMap(s => s.points);
  if (!all.length) {
    box.append(el("div", { class: "empty" }, "這個時間範圍內還沒有資料"));
    return;
  }
  const W = Math.max(box.clientWidth, 280), H = 240;
  const m = { l: 44, r: endLabel ? 64 : 16, t: 14, b: 26 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;

  const times = [...new Set(all.map(p => p.d.getTime()))].sort((a, b) => a - b);
  let t0 = times[0], t1 = times[times.length - 1];
  if (t0 === t1) { t0 -= 3600e3; t1 += 3600e3; }
  const vals = all.map(p => p.v).concat(target ? [target] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const padv = (hi - lo || hi * 0.1 || 1) * 0.12;
  const ticks = niceTicks(Math.max(0, lo - padv), hi + padv, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];

  const x = t => m.l + (t - t0) / (t1 - t0) * pw;
  const y = v => m.t + (1 - (v - lo) / (hi - lo)) * ph;
  const surface = css("--surface");

  const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, height: H, tabindex: 0, role: "img",
    "aria-label": "價格走勢圖，使用左右方向鍵逐點查看" });

  // grid + y ticks
  for (const v of ticks) {
    root.append(svg("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v),
      stroke: css(v === lo ? "--axis" : "--grid"), "stroke-width": 1 }));
    root.append(svg("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", class: "tick" }, compact(v)));
  }
  // x ticks
  const longSpan = t1 - t0 > 36 * 3600e3;
  const n = Math.min(5, Math.max(2, Math.floor(pw / 110)));
  for (let i = 0; i < n; i++) {
    const t = t0 + (t1 - t0) * i / (n - 1), d = new Date(t);
    const label = longSpan ? `${d.getMonth() + 1}/${d.getDate()}` : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    root.append(svg("text", { x: x(t), y: H - 6, class: "tick",
      "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle" }, label));
  }

  // target reference line
  if (target) {
    root.append(svg("line", { x1: m.l, x2: W - m.r, y1: y(target), y2: y(target),
      stroke: css("--text-muted"), "stroke-width": 1 }));
    root.append(svg("text", { x: m.l + 4, y: y(target) - 5, class: "tick halo" }, `目標 ${fmt(target)}`));
  }

  // lines (step-after：兩次檢查之間價格視為不變)
  for (const s of series) {
    const p = s.points;
    if (p.length > 1) {
      let d = `M${x(p[0].d.getTime())},${y(p[0].v)}`;
      for (let i = 1; i < p.length; i++) d += `H${x(p[i].d.getTime())}V${y(p[i].v)}`;
      root.append(svg("path", { d, fill: "none", stroke: s.color, "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    const last = p[p.length - 1];
    if (last) {
      root.append(svg("circle", { cx: x(last.d.getTime()), cy: y(last.v), r: 4,
        fill: s.color, stroke: surface, "stroke-width": 2 }));
      if (endLabel) root.append(svg("text", { x: x(last.d.getTime()) + 9, y: y(last.v) + 4, class: "dlabel" }, fmt(last.v)));
    }
    if (markMin && p.length > 2) {
      const min = p.reduce((a, b) => b.v < a.v ? b : a);
      if (min !== last) {
        const cx = x(min.d.getTime()), cy = y(min.v);
        root.append(svg("circle", { cx, cy, r: 4, fill: s.color, stroke: surface, "stroke-width": 2 }));
        const below = cy < m.t + 20;
        root.append(svg("text", { x: cx, y: below ? cy + 18 : cy - 9, "text-anchor": "middle", class: "dlabel" },
          `最低 ${fmt(min.v)}`));
      }
    }
  }

  // crosshair + tooltip
  const cross = svg("line", { y1: m.t, y2: m.t + ph, stroke: css("--axis"), "stroke-width": 1, visibility: "hidden" });
  const hoverDots = svg("g", { visibility: "hidden" });
  root.append(cross, hoverDots);
  const hit = svg("rect", { x: m.l, y: m.t, width: pw, height: ph, fill: "transparent" });
  root.append(hit);
  box.append(root);
  const tip = el("div", { class: "tooltip", hidden: "" });
  box.append(tip);

  let idx = -1;
  const valueAt = (s, t) => {  // 該時間點（含之前）最近一次的價格
    let v = null;
    for (const p of s.points) { if (p.d.getTime() <= t) v = p.v; else break; }
    return v;
  };
  function show(i) {
    idx = Math.max(0, Math.min(times.length - 1, i));
    const t = times[idx], cx = x(t);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx);
    cross.setAttribute("visibility", "visible");
    hoverDots.replaceChildren();
    const rows = series.map(s => ({ s, v: valueAt(s, t) })).filter(r => r.v != null).sort((a, b) => a.v - b.v);
    for (const { s, v } of rows)
      hoverDots.append(svg("circle", { cx, cy: y(v), r: 4, fill: s.color, stroke: surface, "stroke-width": 2 }));
    hoverDots.setAttribute("visibility", "visible");

    tip.replaceChildren(el("div", { class: "t" }, fmtTime(new Date(t))));
    for (const { s, v } of rows) {
      const row = el("div", { class: "row" });
      const key = el("span", { class: "key" }); key.style.background = s.color;
      row.append(key, el("span", { class: "val" }, money(v)), el("span", { class: "name" }, s.name));
      tip.append(row);
    }
    tip.hidden = false;
    const scale = box.clientWidth / W;
    const tw = tip.offsetWidth;
    let left = cx * scale + 12;
    if (left + tw > box.clientWidth) left = cx * scale - tw - 12;
    tip.style.left = Math.max(0, left) + "px";
    tip.style.top = (m.t * scale) + "px";
  }
  function hide() {
    cross.setAttribute("visibility", "hidden");
    hoverDots.setAttribute("visibility", "hidden");
    tip.hidden = true;
    idx = -1;
  }
  hit.addEventListener("pointermove", e => {
    const r = root.getBoundingClientRect();
    const t = t0 + ((e.clientX - r.left) * (W / r.width) - m.l) / pw * (t1 - t0);
    let best = 0;
    for (let i = 1; i < times.length; i++) if (Math.abs(times[i] - t) < Math.abs(times[best] - t)) best = i;
    show(best);
  });
  hit.addEventListener("pointerleave", hide);
  root.addEventListener("focus", () => show(times.length - 1));
  root.addEventListener("blur", hide);
  root.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { show(idx - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(idx + 1); e.preventDefault(); }
    if (e.key === "Escape") hide();
  });
}

// ---------- cards
function stat(k, v, sub, cls = "") {
  const d = el("div", { class: "stat" });
  d.append(el("div", { class: "k" }, k), el("div", { class: "v " + cls }, v));
  if (sub) d.append(el("div", { class: "sub" }, sub));
  return d;
}

function pickSources(offers) {
  // 取最新報價最便宜的幾個網站；依名稱排序讓顏色固定跟著網站
  const latest = Object.entries(offers).map(([name, pts]) => [name, pts[pts.length - 1].price]);
  latest.sort((a, b) => a[1] - b[1]);
  return latest.slice(0, MAX_SOURCES).map(([n]) => n).sort((a, b) => a.localeCompare(b));
}

function renderCard(p) {
  const id = p.token + p.trip;
  const mode = modes[id] || "lowest";
  const card = el("section", { class: "card" });

  const head = el("div", { class: "card-head" });
  const title = el("div");
  title.append(el("h2", {}, p.name), el("div", { class: "trip" }, p.trip));
  const seg = el("div", { class: "seg", role: "group", "aria-label": "顯示方式" });
  for (const [val, label] of [["lowest", "最低價"], ["sources", "各網站"]]) {
    const b = el("button", { "aria-pressed": String(mode === val) }, label);
    b.onclick = () => { modes[id] = val; render(); };
    seg.append(b);
  }
  head.append(title, seg);
  card.append(head);

  const full = p.series.map(r => ({ d: new Date(r.t), v: r.price, total: r.total, source: r.source }));
  const pts = inRange(full);
  const last = full[full.length - 1], prev = full[full.length - 2];

  // stats
  const stats = el("div", { class: "stats" });
  if (!last) {
    card.append(el("div", { class: "empty" }, "還沒有資料，按「立即檢查」開始記錄"));
    return card;
  }
  stats.append(stat("目前最低（每晚）", money(last.v),
    [last.source && `@ ${last.source}`, `總價 ${money(last.total)}`].filter(Boolean).join("　")));
  if (prev) {
    const diff = last.v - prev.v;
    if (diff < 0) stats.append(stat("較上次", `▼ ${fmt(-diff)}`, `降 ${(-diff / prev.v * 100).toFixed(1)}%`, "good"));
    else if (diff > 0) stats.append(stat("較上次", `▲ ${fmt(diff)}`, `漲 ${(diff / prev.v * 100).toFixed(1)}%`));
    else stats.append(stat("較上次", "持平", fmtTime(prev.d)));
  } else {
    stats.append(stat("較上次", "—", "第一次記錄"));
  }
  const ranged = pts.length ? pts : full;
  const low = ranged.reduce((a, b) => b.v < a.v ? b : a);
  stats.append(stat(rangeHours ? "區間最低" : "歷史最低", money(low.v), fmtTime(low.d)));
  if (p.target_price) {
    const hit = last.v <= p.target_price;
    stats.append(stat("目標價", money(p.target_price),
      hit ? "✓ 已達成" : `還差 ${fmt(last.v - p.target_price)}`, hit ? "good" : ""));
  } else {
    stats.append(stat("記錄次數", String(full.length), `從 ${fmtTime(full[0].d)}`));
  }
  card.append(stats);

  // chart
  const box = el("div", { class: "chart" });
  card.append(box);
  let series;
  if (mode === "lowest") {
    series = [{ name: "最低價", color: css("--s1"), points: pts }];
  } else {
    const names = pickSources(p.offers);
    series = names.map((n, i) => ({
      name: n, color: css(SLOTS[i]),
      points: inRange(p.offers[n].map(r => ({ d: new Date(r.t), v: r.price }))),
    }));
    const legend = el("div", { class: "legend" });
    series.forEach(s => {
      const item = el("span"); const key = el("i"); key.style.background = s.color;
      item.append(key, document.createTextNode(s.name)); legend.append(item);
    });
    const more = Object.keys(p.offers).length - names.length;
    if (more > 0) legend.append(el("span", {}, `（另有 ${more} 個網站較貴，未顯示）`));
    card.append(legend);
  }
  // 卡片加進 DOM 後才量得到寬度
  requestAnimationFrame(() => renderChart(box, series,
    { target: p.target_price, endLabel: mode === "lowest", markMin: mode === "lowest" }));

  // table
  const det = el("details");
  det.append(el("summary", {}, "資料表"));
  const wrap = el("div", { class: "tablewrap" });
  const table = el("table");
  const hr = el("tr");
  const cols = mode === "lowest" ? ["時間", "最低每晚", "總價", "網站"] : ["時間", ...series.map(s => s.name)];
  cols.forEach(c => hr.append(el("th", {}, c)));
  const thead = el("thead");
  thead.append(hr);
  table.append(thead);
  const tb = el("tbody");
  [...pts].reverse().forEach(r => {
    const tr = el("tr");
    if (mode === "lowest") {
      [fmtTime(r.d), fmt(r.v), fmt(r.total), r.source || "—"].forEach(c => tr.append(el("td", {}, c)));
    } else {
      tr.append(el("td", {}, fmtTime(r.d)));
      series.forEach(s => {
        const hitP = s.points.find(q => q.d.getTime() === r.d.getTime());
        tr.append(el("td", {}, hitP ? fmt(hitP.v) : "—"));
      });
    }
    tb.append(tr);
  });
  table.append(tb);
  wrap.append(table);
  det.append(wrap);
  card.append(det);
  return card;
}

function render() {
  if (!DATA) return;
  const cards = $("#cards");
  const open = new Set([...cards.querySelectorAll("details[open]")].map(d => d.closest(".card").dataset.id));
  cards.replaceChildren();
  if (!DATA.properties.length) {
    cards.append(el("div", { class: "card empty" }, "config.toml 裡還沒有任何 [[property]]"));
  }
  for (const p of DATA.properties) {
    const c = renderCard(p);
    c.dataset.id = p.token + p.trip;
    if (open.has(c.dataset.id)) { const d = $("details", c); if (d) d.open = true; }
    cards.append(c);
  }
}

function renderStatus() {
  const times = DATA.properties.flatMap(p => p.series.map(r => r.t)).sort();
  const lastT = times[times.length - 1];
  const schedule = DATA.static ? "雲端定時檢查" : `每 ${DATA.interval_minutes} 分鐘自動檢查`;
  $("#status").textContent = DATA.running ? "檢查中…"
    : (lastT ? `上次檢查 ${fmtTime(new Date(lastT))}` : "尚未檢查") + `｜${schedule}`;
  // 靜態網站（雲端）沒有後端可以觸發檢查，改成連到 GitHub Actions 手動執行
  $("#checkBtn").hidden = !!DATA.static;
  $("#checkBtn").disabled = !!DATA.running;
  $("#runLink").hidden = !(DATA.static && DATA.run_url);
  if (DATA.run_url) $("#runLink").href = DATA.run_url;
  const banner = $("#banner");
  banner.hidden = !DATA.last_error;
  banner.textContent = DATA.last_error ? `上次檢查失敗：${DATA.last_error}` : "";
}

async function load() {
  clearTimeout(pollTimer);
  try {
    // 雲端靜態網站讀 data.json；本機 serve 讀 /api/data
    let res = await fetch("data.json", { cache: "no-store" });
    if (!res.ok) res = await fetch("/api/data");
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    DATA = json;
    renderStatus();
    render();
  } catch (e) {
    const banner = $("#banner");
    banner.hidden = false;
    banner.textContent = `讀取資料失敗：${e.message}`;
  }
  pollTimer = setTimeout(load, DATA && DATA.running ? 3000 : DATA && DATA.static ? 300000 : 60000);
}

$("#checkBtn").onclick = async () => {
  $("#checkBtn").disabled = true;
  $("#status").textContent = "檢查中…";
  await fetch("/api/check", { method: "POST" });
  setTimeout(load, 1000);
};
$("#range").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  rangeHours = Number(b.dataset.h);
  $("#range").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);

load();
</script>
</body>
</html>
